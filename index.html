<!DOCTYPE html>

<head>

<meta name="description" content="Bookends: morning intentions and nightly reflections, one wellness check-in at a time.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="60 50 120 120" role="img" aria-label="Bookends logo">
        <path d="M90 62H70V158H90" fill="none" stroke="var(--morning)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M150 62H170V158H150" fill="none" stroke="var(--night)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M120 80A30 30 0 0 0 120 140Z" fill="var(--morning)"/><path d="M120 80A30 30 0 0 1 120 140Z" fill="var(--night)"/>
      </svg>
      <div>
      <h1>Bookends <span class="h1-sub"><span class="pipe">| </span>Intentions &amp; Reflections</span></h1>
      <div class="sub" id="greeting">Wellness check-ins, morning and night</div>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="today" class="on">Today</button>
    <button data-v="history">History</button>
    <button data-v="badges">Badges</button>
    <button data-v="settings">Settings</button>
    <button data-v="about">About</button>
  </nav>
  <main id="app"><div class="loading">Loading your check-ins…</div></main>
  <footer class="help">If you're struggling or in crisis, call or text <b>988</b> (US Suicide &amp; Crisis Lifeline), any time.</footer>
</div>
